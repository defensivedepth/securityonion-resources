name: Replace Sigma Placeholders

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  replace_and_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v3
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Create or checkout playbook-stable branch
        run: |
          if git show-ref --verify --quiet refs/heads/playbook-stable; then
            git checkout playbook-stable
            git merge dev
          else
            git checkout -b playbook-stable
          fi

      - name: Replace patterns using patterns.sed
        run: |
          for file in $(find playbook/dev/sigma -type f -name '*.yaml'); do
            sed -i -f patterns.sed "$file"
          done
          
      - name: Commit and push if changes found
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Replace Sigma placeholders using ECS mappings"
            git pull --rebase origin playbook-stable
            git push origin playbook-stable
          else
            echo "No changes to commit."
            exit 0
          fi
