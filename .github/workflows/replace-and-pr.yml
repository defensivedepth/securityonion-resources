name: Replace Sigma Placeholders and Create PR

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  replace_and_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v3
        with:
          ref: dev
          fetch-depth: 0
          
      - name: Fetch dev-stable
        run: git fetch origin dev-stable:dev-stable

      - name: Set up Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Create new branch from dev
        id: vars
        run: |
          BRANCH_NAME="sigma-field-replace-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Replace patterns using patterns.sed
        run: |
          for file in $(find playbook/dev/sigma -type f -name '*.yaml'); do
            sed -i -f patterns.sed "$file"
          done

      - name: Commit and push if changes found
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Replace Sigma placeholders using ECS mappings"
            git push origin "${{ steps.vars.outputs.branch_name }}"
          else
            echo "No changes to commit."
            exit 0
          fi
